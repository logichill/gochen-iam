name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gochen-iam
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          path: gochen-iam
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gochen
          ref: ${{ vars.GOCHEN_CORE_REF }}
          path: gochen
          token: ${{ secrets.GOCHEN_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gochen-runtime
          ref: ${{ vars.GOCHEN_RUNTIME_REF }}
          path: gochen-runtime
          token: ${{ secrets.GOCHEN_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: gochen-iam/go.mod
          cache: true
          cache-dependency-path: gochen-iam/go.sum

      - name: gofmt
        run: |
          files=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$files" ]; then
            echo "gofmt needed:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        env:
          GO_TELEMETRY: off
        run: go vet ./...

      - name: go test
        env:
          GO_TELEMETRY: off
        run: go test ./... -count=1
